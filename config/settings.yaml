llm:
  provider: openai_compatible
  model: qwen-plus
  api_key: "${DASHSCOPE_API_KEY}"
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  temperature: 0.7

schedule:
  runs_per_day: 2
  min_interval_hours: 6
  time_randomization_minutes: 90

anti_risk:
  enabled: true
  stop_on_verification: true

  # Browser backend: "cloakbrowser" or "playwright".
  browser_backend: cloakbrowser
  cloak_stealth_args: true
  cloak_humanize: true
  cloak_human_preset: careful
  # Optional: set to local chrome.exe/msedge.exe to skip CloakBrowser binary download.
  cloak_binary_path: "E:/java learning/cloakbrowser-windows-x64/chrome.exe"
  # Fail fast instead of hanging silently while the browser backend starts.
  cloak_start_timeout_seconds: 120

  # Keep browser fingerprint close to the real browser. Turning these on may
  # reduce obvious Playwright signals in some sites, but can also create
  # inconsistent fingerprints and trigger checks.
  stealth_mode: false
  randomize_user_agent: false
  randomize_viewport: false

  # Wait after search results load, before/around sorting.
  search_delay_seconds: [1, 2]
  # Wait after clicking "price low to high".
  sort_delay_seconds: [1, 2]
  # Wait before and after result page turns.
  page_turn_delay_seconds: [1, 3]
  # Wait between individual list items while filtering.
  per_item_delay_seconds: [1, 2]
  # Wait before entering a product detail page.
  detail_click_delay_seconds: [1, 3]
  # Wait before clicking buy on the detail page.
  buy_click_delay_seconds: [1, 3]
  # Cool down after returning from a detail/order check.
  post_detail_cooldown_seconds: [1, 3]

  # Conservative defaults reduce order-page visits, which are the riskiest action.
  max_pages_per_keyword: 3
  max_detail_clicks_per_keyword: 30
  max_detail_clicks_per_run: 60

  # Prefer current-tab navigation over repeatedly opening new tabs.
  open_detail_in_new_page: false

proxy:
  enabled: false

notification:
  dingtalk:
    enabled: false
    webhook_url: ""
